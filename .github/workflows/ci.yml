name: CI

on:
  # Tag pushes are verified by release.yml, which calls this workflow.
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version to build instead of a throwaway CI version.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  RELEASE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_XMLDOC_MODE: skip

jobs:
  windows:
    name: Windows quality and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up current .NET servicing SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Markdown linter
        run: cargo install rumdl --version 0.0.218 --locked

      - name: Run repository checks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      # Also installs the Windows CLI archive and runs the process contract
      # tests against the installed executable.
      - name: Publish and certify release artifacts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/publish.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/publish/${{ env.RELEASE_VERSION }}
          if-no-files-found: error

  portable:
    name: Portable core and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up current .NET servicing SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore portable projects
        run: |
          dotnet restore tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --locked-mode
          dotnet restore tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --locked-mode

      - name: Build portable projects
        run: |
          dotnet build tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test portable projects
        run: |
          dotnet test tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/portable
          dotnet test tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/portable

      - name: Upload portable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results
          path: artifacts/test-results/portable
          if-no-files-found: warn

  linux-artifact:
    name: Linux CLI artifact
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up current .NET servicing SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/release

      - name: Install and certify the Linux CLI archive
        shell: pwsh
        run: ./scripts/test-artifact.ps1 -ReleaseDirectory artifacts/release -Version $env:RELEASE_VERSION
