name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_XMLDOC_MODE: skip

jobs:
  windows:
    name: Windows quality and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up current .NET servicing SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Markdown linter
        run: cargo install rumdl --version 0.0.218 --locked

      - name: Run repository checks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Publish smoke-test artifacts
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/publish.ps1
          -Version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"

      - name: Upload publish smoke test
        uses: actions/upload-artifact@v4
        with:
          name: windows-publish-smoke
          path: artifacts/publish/0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          if-no-files-found: error

  portable:
    name: Portable core and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up current .NET servicing SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore portable projects
        run: |
          dotnet restore tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --locked-mode
          dotnet restore tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --locked-mode

      - name: Build portable projects
        run: |
          dotnet build tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test portable projects
        run: |
          dotnet test tests/ExcelFormulaRemover.Core.Tests/ExcelFormulaRemover.Core.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/portable
          dotnet test tests/ExcelFormulaRemover.Cli.Tests/ExcelFormulaRemover.Cli.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/portable

      - name: Upload portable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results
          path: artifacts/test-results/portable
          if-no-files-found: warn
