name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Build and certify
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download certified artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      # Published tags and assets are immutable: this fails rather than
      # replaces if the release already exists. Corrections use a new version.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The install guide resolves the latest release, so a pre-release
          # version must never become it.
          case "$VERSION" in
            *-*) channel="--prerelease --latest=false" ;;
            *) channel="" ;;
          esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "xlclean $VERSION" \
            --generate-notes $channel
